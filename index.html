<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXUS OS</title>
    <link rel="stylesheet" href="css/nexus.css">
</head>
<body>

<div id="desktop">

    <!-- BOOT SCREEN -->
    <div id="bootScreen">
        <div class="boot-logo">N</div>
        <div class="boot-text">NEXUS OS</div>
    </div>

    <!-- GÓRNY PASEK -->
    <header class="topbar">
        <div class="brand">
            <div class="nexus-logo">N</div>
            <span>NEXUS OS</span>
        </div>
        <div class="status">
            <span id="systemStatus" class="status-item">
                <span class="status-dot"></span>
                SYSTEM GOTOWY
            </span>
            <span id="systemTime" class="status-item">00:00</span>
        </div>
    </header>

    <!-- CENTRALNY EKRAN -->
    <main class="center">
        <div class="ai-orb" onclick="openWindow('aiWindow')" title="NEXUS AI"></div>
        <h1>NEXUS</h1>
        <p class="subtitle">Twój system. Twoja przestrzeń.</p>
